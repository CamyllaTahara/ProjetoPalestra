<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_cadastro.css') }}">

    <script src="https://unpkg.com/imask"></script>

    <title>Cadastro Palestrante</title>    

</head>

<body>
    <canvas id="canvas-bg"></canvas>
    
    <div class="login-container cadastro-wide">
        <div class="header-intro">
            <h1>Cadastro do Palestrante</h1>
        </div>

        <div class="card-login">
            <div class="card-icon">
                <i data-lucide="user-plus"></i>
            </div>

            {% if mensagem_sucesso %}
                <div class="sucesso">{{ mensagem_sucesso }}</div>
            {% endif %}
            
            {% if mensagem_erro %}
                <div class="erro">{{ mensagem_erro }}</div>
            {% endif %}

            <form method="POST" enctype="multipart/form-data" class="cadastro-grid">
                
                <div class="input-group full-width">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" value="{{ dados_form.nome }}" required>
                </div>

                <div class="input-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" value="{{ dados_form.cpf }}" required>
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="{{ dados_form.email }}" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" value="{{ dados_form.telefone }}" required>
                </div>

                <div class="input-group">
                    <label for="anos_experiencia">Anos de Experiência:</label>
                    <input type="text" id="anos_experiencia" name="anos_experiencia" value="{{ dados_form.anos_experiencia }}" required>
                </div>

                <div class="input-group full-width">
                    <label for="ramo_atividade">Ramo de atividade:</label>
                    <input type="text" id="ramo_atividade" name="ramo_atividade" value="{{ dados_form.ramo_atividade }}" required>
                </div>

                <div class="input-group full-width">
                <label>Anexe seu currículo aqui:</label>
                <input type="file" id="curriculo" name="curriculo" accept=".pdf" class="input-file-hidden">
                <label for="curriculo" class="custom-file-upload">
                <i data-lucide="upload-cloud"></i> 
                <span id="file-name">Selecionar PDF</span>
                </label>
                </div>

                <div class="input-group full-width">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                    
                    <div class="password-checklist">
                        <div class="check-item" id="rule-length">
                            <span class="checkmark"></span>
                            <span class="text">Mínimo de 8 caracteres</span>
                        </div>
                        <div class="check-item" id="rule-upper">
                            <span class="checkmark"></span>
                            <span class="text">Pelo menos uma letra maiúscula</span>
                        </div>
                        <div class="check-item" id="rule-lower">
                            <span class="checkmark"></span>
                            <span class="text">Pelo menos uma letra minúscula</span>
                        </div>
                        <div class="check-item" id="rule-number">
                            <span class="checkmark"></span>
                            <span class="text">Pelo menos um número</span>
                        </div>
                        <div class="check-item" id="rule-special">
                            <span class="checkmark"></span>
                            <span class="text">Pelo menos um caractere especial (!@#$%&*)</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-login full-width">Finalizar Cadastro</button>
            </form>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('senha');
        const rules = {
            length: document.getElementById('rule-length'),
            upper: document.getElementById('rule-upper'),
            lower: document.getElementById('rule-lower'),
            number: document.getElementById('rule-number'),
            special: document.getElementById('rule-special')
        };

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;

            toggleRule(rules.length, val.length >= 8);
            toggleRule(rules.upper, /[A-Z]/.test(val));
            toggleRule(rules.lower, /[a-z]/.test(val));
            toggleRule(rules.number, /[0-9]/.test(val));
            toggleRule(rules.special, /[!@#$%&*]/.test(val));
        });

        function toggleRule(element, isValid) {
            if (isValid) {
                element.classList.add('valid');
            } else {
                element.classList.remove('valid');
            }
        }

         // Máscara para telefone

        var telefoneInput = document.getElementById('telefone');

        if (telefoneInput) {

            IMask(telefoneInput, {

                mask: '(00) 00000-0000',

                mask: '(00) 0000-0000'

            });

        }



        // Máscara para CPF

        var cpfInput = document.getElementById('cpf');

        if (cpfInput) {

            IMask(cpfInput, {

                mask: '000.000.000-00'

            });

        }



        // Função para validar a senha

        function validarSenha() {

            var senha = document.getElementById("senha").value;

            var comprimento = document.getElementById("comprimento");

            var maiuscula = document.getElementById("maiuscula");

            var minuscula = document.getElementById("minuscula");

            var numeroSenha = document.getElementById("numeroSenha");

            var especial = document.getElementById("especial");



            comprimento.classList.toggle("valid", senha.length >= 8);

            comprimento.classList.toggle("invalid", senha.length < 8);



            maiuscula.classList.toggle("valid", /[A-Z]/.test(senha));

            maiuscula.classList.toggle("invalid", !/[A-Z]/.test(senha));



            minuscula.classList.toggle("valid", /[a-z]/.test(senha));

            minuscula.classList.toggle("invalid", !/[a-z]/.test(senha));



            numeroSenha.classList.toggle("valid", /\d/.test(senha));

            numeroSenha.classList.toggle("invalid", !/\d/.test(senha));



            especial.classList.toggle("valid", /[!@#$%&*]/.test(senha));

            especial.classList.toggle("invalid", !/[!@#$%&*]/.test(senha));

        }

        document.getElementById('curriculo').addEventListener('change', function() {
    const fileName = this.files[0] ? this.files[0].name : "Selecionar PDF";
    document.getElementById('file-name').textContent = fileName;
});
    </script>

     <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
