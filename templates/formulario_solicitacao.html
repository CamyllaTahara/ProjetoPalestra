<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Palestra | {{ palestrante.nome_completo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_formulario_solicitacao.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <div class="card-form">
    <h1>Solicitar Palestra</h1>
    
    <div class="palestrante-info">
        <i data-lucide="user"></i> Palestrante: <strong>{{ palestrante.nome_completo }}</strong>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="titulo">Título da Palestra </label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex: Inovação e TI" required>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" placeholder="Objetivo da palestra..."></textarea>
        </div>

        <div class="form-group">
            <label for="endereco_palestra">Local</label>
            <input type="text" id="endereco_palestra" name="endereco_palestra" placeholder="Cidade, Estado ou endereço completo">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="data_proposta"> <i data-lucide="calendar" ></i>Data Proposta </label>
                <input type="date" id="data_proposta" name="data_proposta" required>
            </div>
            <div class="form-group">
                <label for="horario_proposta"> <i data-lucide="clock"></i> Hórario Proposto </label>
                <input type="time" id="horario_proposta" name="horario_proposta" required>
            </div>
        </div>

        <div class="button-group">
            <button type="submit">Enviar Solicitação</button>
            <a href="{{ url_for('gerenciar_solicitacoes.perfil_palestrante', palestrante_id=palestrante.id) }}" class="btn-secondary">
                     Cancelar</a>
        </div>
    </form>
</div>
    </div>

    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
<script>
     lucide.createIcons();
</script>

   
</body>
</html>
