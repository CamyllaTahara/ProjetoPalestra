<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if instituicao %}Editar{% else %}Nova{% endif %} Instituição | PalestraApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_form_instituicao.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="card-form">
        <h1>
            <i data-lucide="building-2" style="vertical-align: middle; margin-right: 8px; width: 24px; height: 24px;"></i>
            {% if instituicao %}Editar{% else %}Nova{% endif %} Instituição
        </h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            
            <div class="form-group">
                <label for="nome">Nome da Instituição *</label>
                <input type="text" id="nome" name="nome" 
                       placeholder="Ex: Universidade Tecnológica"
                       value="{{ instituicao.nome if instituicao else '' }}" 
                       required>
            </div>

            <div class="form-group">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj" 
                       value="{{ instituicao.cnpj if instituicao else '' }}"
                       placeholder="00.000.000/0000-00"
                       maxlength="18"
                       oninput="mascaraCNPJ(this)">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" 
                           placeholder="contato@instituicao.com"
                           value="{{ instituicao.email if instituicao else '' }}" 
                           required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" 
                           value="{{ instituicao.telefone if instituicao else '' }}"
                           placeholder="(00) 99999-9999"
                           maxlength="15"
                           oninput="mascaraTelefone(this)">
                </div>
            </div>

            <div class="row-endereco">
                <div class="form-group">
                    <label for="endereco">Endereço / Logradouro</label>
                    <input type="text" id="endereco" name="endereco" 
                           placeholder="Av. Paulista, Bairro..."
                           value="{{ instituicao.endereco if instituicao else '' }}">
                </div>
                <div class="form-group">
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" 
                           placeholder="123"
                           value="{{ instituicao.numero if instituicao else '' }}">
                </div>
            </div>

            <div class="button-group">
                <button type="submit">
                    {% if instituicao %}Salvar Alterações{% else %}Cadastrar{% endif %}
                </button>
                <a href="{{ url_for('gerenciar_instituicoes.listar_instituicoes') }}" class="btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();

        // Máscara dinâmica de CNPJ
        function mascaraCNPJ(input) {
            let v = input.value.replace(/\D/g, "");
            
            if (v.length > 14) v = v.slice(0, 14);

            v = v.replace(/^(\d{2})(\d)/, "$1.$2");
            v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
            v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
            v = v.replace(/(\d{4})(\d)/, "$1-$2");
            
            input.value = v;
        }

        // Máscara dinâmica de Telefone (Celular / Fixo)
        function mascaraTelefone(input) {
            let v = input.value.replace(/\D/g, "");
            if (v.length > 11) v = v.slice(0, 11);

            if (v.length > 10) {
                v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
            } else if (v.length > 6) {
                v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
            } else if (v.length > 2) {
                v = v.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
            } else if (v.length > 0) {
                v = v.replace(/^(\d{0,2})$/, "($1");
            }
            input.value = v;
        }

        // Formata os campos automaticamente se já contiverem dados ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            const telInput = document.getElementById('telefone');
            const cnpjInput = document.getElementById('cnpj');
            
            if (telInput && telInput.value) mascaraTelefone(telInput);
            if (cnpjInput && cnpjInput.value) mascaraCNPJ(cnpjInput);
        });
    </script>
    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>
</body>
</html>
