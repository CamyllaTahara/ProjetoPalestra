<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if palestrante %}Editar{% else %}Novo{% endif %} Palestrante | PalestraApp</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style_form_palestrante.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="card-form">
        <h1>
            <i data-lucide="user-plus" style="vertical-align: middle; margin-right: 8px; width: 24px; height: 24px;"></i>
            {% if palestrante %}Editar Palestrante{% else %}Novo Palestrante{% endif %}
        </h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            
            <div class="form-group">
                <label for="nome_completo">Nome do Palestrante </label>
                <input type="text" id="nome_completo" name="nome_completo" 
                       placeholder="Nome completo"
                       value="{{ palestrante.nome_completo if palestrante else '' }}" 
                       required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" 
                       placeholder="exemplo@email.com"
                       value="{{ palestrante.email if palestrante else '' }}" 
                       required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone de Contato</label>
                <input type="tel" id="telefone" name="telefone" 
                       value="{{ palestrante.telefone if palestrante else '' }}"
                       placeholder="(00) 00000-0000"
                       maxlength="15"
                       oninput="mascaraTelefone(this)">
            </div>

            <div class="button-group">
                <button type="submit">
                    {% if palestrante %}Salvar Alterações{% else %}Cadastrar{% endif %}
                </button>
                <a href="{{ url_for('gerenciar_palestrantes.listar_palestrantes') }}" class="btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

    <script>

        lucide.createIcons();

         function mascaraTelefone(input) {
            // Remove tudo o que não for dígito
            let v = input.value.replace(/\D/g, "");
            
            // Limita a quantidade de caracteres caso venha algo errado
            if (v.length > 11) {
                v = v.slice(0, 11);
            }

            // Aplica a formatação baseada no tamanho atual do texto
            if (v.length > 10) {
                // Formato Celular: (XX) XXXXX-XXXX
                v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
            } else if (v.length > 6) {
                // Formato Fixo temporário enquanto digita: (XX) XXXX-XXXX
                v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, "($1) $2-$3");
            } else if (v.length > 2) {
                // Formato Inicial com DDD: (XX) XXXX
                v = v.replace(/^(\d{2})(\d{0,5})$/, "($1) $2");
            } else if (v.length > 0) {
                // Apenas abrindo o DDD: (XX
                v = v.replace(/^(\d{0,2})$/, "($1");
            }
            
            input.value = v;
        }

        // Executa a máscara ao carregar a página se o campo já tiver dados (modo edição)
        window.addEventListener('DOMContentLoaded', () => {
            const telInput = document.getElementById('telefone');
            if (telInput && telInput.value) {
                mascaraTelefone(telInput);
            }

        });
    </script>

    <script src="{{ url_for('static', filename='js/particles.js') }}"></script>

</body>
</html>
